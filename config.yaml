# Shared pipeline config. Values marked TBD are owned by team role A; don't guess them.

aoi:
  # Placeholder — replace after the HiRISE DTM pick (Step 2).
  name: Arcadia Planitia (placeholder)
  center_lon_e: 184.0 # east-positive, planetocentric
  center_lat_n: 46.0
  buffer_m: 200

crs:
  # Mars 2000 sphere (IAU_2015:49900, R = 3396190 m), equirectangular centered on the AOI.
  geographic: IAU_2015:49900
  projected: "+proj=eqc +lat_ts=46 +lon_0=184 +R=3396190 +units=m +no_defs"
  resolution_m: TBD # set from the chosen DTM

thresholds:
  # Every value below is a PLACEHOLDER default so the code can run — none is an agreed flight rule.
  # Find them all with: grep -rn PLACEHOLDER. Team role A replaces them before the demo.
  slope_max_deg: 20 # PLACEHOLDER — Artemis lunar planning value, unverified for Mars
  suit_budget_h: 8 # PLACEHOLDER — nominal EVA suit consumables budget (hours)
  radiation_caution_ugy_per_h: 50 # PLACEHOLDER — RAD absorbed-dose rate that flips GO → CAUTION
  radiation_no_go_ugy_per_h: 500 # PLACEHOLDER — RAD absorbed-dose rate that flips → NO_GO
  walk_back_reserve_pct: 30 # PLACEHOLDER — consumables kept in reserve for the return at degraded pace
