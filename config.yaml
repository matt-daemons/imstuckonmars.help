# Shared pipeline config. Values marked TBD are owned by team role A; don't guess them.

aoi:
  # Habitat + 4 HiRISE sites span the drive corridor (172–194 °E); the centre is near the habitat.
  name: Arcadia Planitia · simulated base
  center_lon_e: 184.0 # east-positive, planetocentric
  center_lat_n: 46.0
  buffer_m: 200

crs:
  # Mars 2000 sphere (IAU_2015:49900, R = 3396190 m), equirectangular centered on the AOI.
  geographic: IAU_2015:49900
  projected: "+proj=eqc +lat_ts=46 +lon_0=184 +R=3396190 +units=m +no_defs"
  resolution_m: TBD # set from the chosen DTM

thresholds:
  # Flight rules, set by team role A. They mirror lib/flight-rules/rules.ts, which holds the full
  # source for each value. A test (lib/flight-rules/config.test.ts) fails if the two disagree.
  # NASA has published no limits for Mars, so Moon and ISS values are assumptions here.
  slope_max_deg: 20 # NASA lunar suit limit (xEVA concept of operations, NTRS 20200001071, slide 6)
  suit_budget_h: 8 # Artemis suit main supply; walks are planned at 6 h (EVA-EXP-0042 Rev B, p.29)
  suit_reserve_min: 30 # Main supply left on return (ISS suit timeline, NTRS 20140009556, slide 11)
  radiation_caution_ugy_per_h: 18 # ASSUMPTION — twice the quiet rate of about 9 (Curiosity RAD)
  radiation_no_go_ugy_per_h: 90 # ASSUMPTION — ten times the quiet rate; May 2024 peaked near 309
  walk_back_max_km: 2 # 2 km at 2 km/h is 1 h of backup oxygen (EVA-EXP-0042 Rev B, p.40)
  walk_pace_km_h: 2 # Lunar suited walking pace, assumed for Mars (EVA-EXP-0042 Rev B, p.40)
