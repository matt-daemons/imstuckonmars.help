name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  # Public Mapbox pk.* token (repo variable, not a secret); inlined into the client at build time.
  NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy:
    needs: check
    # Demo freeze: `gh variable set DEPLOY_PAUSED --body true` keeps checks running but stops deploys.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAUSED != 'true'
    runs-on: ubuntu-latest
    environment: production
    # Deploy in push order; never cancel a deploy that is already running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # A successful upload doesn't prove the site serves; retry because a new version takes a few seconds to roll out.
      - name: Smoke test production
        run: |
          for path in / /api/health; do
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors "https://imstuckonmars.help$path"
          done
